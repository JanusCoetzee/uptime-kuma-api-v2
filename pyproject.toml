# Tool configuration only. Packaging metadata still lives in setup.py (see #26).

[tool.ruff]
line-length = 79  # PEP 8
target-version = "py312"
extend-exclude = ["env", "build"]

[tool.ruff.lint]
# E/W = pycodestyle (PEP 8), F = pyflakes, B = bugbear
select = ["E", "W", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Baseline of known violations. Each entry is debt: shrink it, never grow it.
"uptime_kuma_api/__init__.py" = ["F401"]  # intentional re-exports
"uptime_kuma_api/api.py" = ["E501"]  # long :param docstring lines
"uptime_kuma_api/_helpers.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_monitor_args.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/api_keys.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/auth.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/heartbeats.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/maintenance.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/monitors.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/notifications.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/settings.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/status_pages.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/_mixins/tags.py" = ["E501"]  # moved out of api.py
"uptime_kuma_api/docstrings.py" = ["E501"]  # generated by scripts/
"scripts/*" = ["E501"]
"tests/*" = ["E501", "E721"]

[tool.mutmut]
# mutmut 3 runs on pytest. Run it on schedule (see ci.yml), not on every PR.
source_paths = ["uptime_kuma_api/"]
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.pytest.ini_options]
pythonpath = ["."]
