[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-kuma-client"
dynamic = ["version"]
description = "A python wrapper for the Uptime Kuma WebSocket API"
readme = "README.md"
requires-python = ">=3.12, <4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Janus Coetzee", email = "januscoetzee@gmail.com" }]
dependencies = [
    "python-socketio[client]>=5.0.0",
    "requests",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/JanusCoetzee/uptime-kuma-api-v2"

[tool.setuptools.packages.find]
include = ["uptime_kuma_client*"]

[tool.setuptools.package-data]
uptime_kuma_client = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "uptime_kuma_client.__version__.__version__" }


[tool.ruff]
line-length = 79  # PEP 8
target-version = "py312"
extend-exclude = ["env", "build"]

[tool.ruff.lint]
# E/W = pycodestyle (PEP 8), F = pyflakes, B = bugbear
select = ["E", "W", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Baseline of known violations. Each entry is debt: shrink it, never grow it.
"uptime_kuma_client/docstrings.py" = ["E501"]  # generated by scripts/

[tool.mutmut]
# mutmut 3 runs on pytest. Run it on schedule (see ci.yml), not on every PR.
source_paths = ["uptime_kuma_client/"]
# tests/unit/test_scripts_utils.py imports scripts/utils.py
also_copy = ["scripts/"]
pytest_add_cli_args_test_selection = ["tests/unit"]
# Generated parameter text, not logic (see scripts/): mutants there only test wording.
do_not_mutate = ["uptime_kuma_client/docstrings.py"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
# Non-strict on purpose (#32): the public API is annotated but loosely
# (bare `dict`/`list`). Tighten one flag at a time.
python_version = "3.12"
files = ["uptime_kuma_client"]

[[tool.mypy.overrides]]
# python-socketio ships no type hints or py.typed marker.
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[tool.importlinter]
# Architecture rules (#71). Run with `lint-imports`.
root_package = "uptime_kuma_client"

[[tool.importlinter.contracts]]
name = "Layers: api -> mixins -> payload/argument helpers -> shared helpers"
type = "layers"
layers = [
    "uptime_kuma_client.api",
    "uptime_kuma_client._mixins",
    "uptime_kuma_client._monitor_args | uptime_kuma_client._monitor_payload",
    "uptime_kuma_client._helpers",
]

[[tool.importlinter.contracts]]
name = "Enums, constants and generated modules do not import the client"
type = "forbidden"
source_modules = [
    "uptime_kuma_client.auth_method",
    "uptime_kuma_client.docker_type",
    "uptime_kuma_client.event",
    "uptime_kuma_client.exceptions",
    "uptime_kuma_client.incident_style",
    "uptime_kuma_client.maintenance_strategy",
    "uptime_kuma_client.monitor_status",
    "uptime_kuma_client.monitor_type",
    "uptime_kuma_client.proxy_protocol",
    "uptime_kuma_client.docstrings",
    "uptime_kuma_client.notification_providers",
]
forbidden_modules = [
    "uptime_kuma_client.api",
    "uptime_kuma_client._mixins",
    "uptime_kuma_client._helpers",
    "uptime_kuma_client._monitor_args",
    "uptime_kuma_client._monitor_payload",
]
