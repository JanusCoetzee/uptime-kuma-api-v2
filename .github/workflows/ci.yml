name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"  # weekly, drives the mutation job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (pre-commit, PEP 8)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0
      # no-commit-to-branch only makes sense on a developer machine
      - run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  types:
    name: types (mypy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      # mypy follows imports, so it needs the runtime dependencies
      - run: pip install -r requirements.txt mypy==2.4.0
      - run: mypy

  generated:
    name: generated code is current
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt BeautifulSoup4==4.15.0 Jinja2==3.1.6
      # the pinned Kuma source the generated files must match (same ref as the test image)
      - name: Fetch the pinned Uptime Kuma source
        run: |
          set -a; . docker/kuma-test/versions.env; set +a
          git init -q uptime-kuma
          git -C uptime-kuma fetch -q --depth 1 https://github.com/louislam/uptime-kuma.git "$KUMA_REF"
          git -C uptime-kuma checkout -q FETCH_HEAD
      - run: python scripts/build_monitor_types.py --check
      - run: python scripts/build_notifications.py --check
      - run: python scripts/build_notification_docstring.py --check

  unit:
    name: unit (py${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.1.0
      # fail_under (the coverage ratchet, target 90) lives in .coveragerc
      - run: pytest tests/unit --cov --cov-report=xml
      - name: Upload coverage report
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  integration:
    name: integration (Kuma ${{ matrix.kuma }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        kuma: ["2.5.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Start Kuma (published image, else built from the pinned commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a; . docker/kuma-test/versions.env; set +a
          test "$KUMA_VERSION" = "${{ matrix.kuma }}"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/uptime-kuma-test"
          # Same content key as kuma-image.yml: a changed Dockerfile never pulls a stale image.
          key="${KUMA_VERSION}-$(git rev-parse --short=12 HEAD:docker/kuma-test)"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "${image}:${key}"; then
            echo "Using ${image}:${key}"
            docker tag "${image}:${key}" kuma-test
          else
            echo "No published image for ${key}; building from source"
            docker build -t kuma-test --build-arg KUMA_REF="$KUMA_REF" docker/kuma-test
          fi
          docker run -d --rm -p 3001:3001 --name kuma-test kuma-test
          for _ in $(seq 60); do curl -sf http://127.0.0.1:3001/api/entry-page && break; sleep 2; done
      - run: pip install -r requirements.txt -r dev-requirements.txt requests
      # unittest finds only the live-server tests here; tests/unit is pytest and runs in the unit job
      - run: python -m unittest discover -s tests

  mutation:
    name: mutation testing (mutmut)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt requests coverage==7.16.2 mutmut==3.8.0
      - run: mutmut run
      - if: always()
        run: mutmut results | tee mutation-results.txt
      - name: Enforce the score threshold
        run: python scripts/mutation_score.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-results
          path: mutation-results.txt
